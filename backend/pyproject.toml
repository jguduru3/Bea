[project]
name = "pom-backend"
version = "1.0.0"
description = "Backend for the Pom desktop companion"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "asyncpg>=0.29",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "anthropic>=1.13",
  "playwright>=1.50",
  "jsonschema>=4.20",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.providers", "app.routers", "app.agent", "app.agent.connectors"]
